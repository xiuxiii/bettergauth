<!doctype html>
<html>

  <!-- top meta rule -->

  <!-- center lockup -->
  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px;">

    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M6 3.5h7.5A2.5 2.5 0 0 1 16 6v3.4h-1.9a2.1 2.1 0 1 0 0 4.2H16V18a2.5 2.5 0 0 1-2.5 2.5H6A2.5 2.5 0 0 1 3.5 18V6A2.5 2.5 0 0 1 6 3.5Z" fill="#4E54DD"/>

      <div style="font-size: 12px; letter-spacing: 0.34em; text-transform: uppercase; color: #4E54DD;">Mind the gap</div>
      <div style="font-family: 'Newsreader', Georgia, serif; font-style: italic; font-weight: 400; font-size: 25px; color: #3B342A;">Learn the why, not just the how.</div>
    </div>
  </div>

  <!-- bottom rule -->
  <div style="height: 1px; background: #E7E0D3;"></div>
  <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 18px; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #8A8070;">
    <span>Ivory · Ink · Indigo</span>
    <span>Newsreader × Hanken</span>
