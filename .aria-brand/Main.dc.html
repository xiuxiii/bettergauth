<!doctype html>
<html>

    <svg width="76" height="76" viewBox="0 0 72 72" fill="none" aria-hidden="true">
      <circle cx="36" cy="36" r="34.25" stroke="#6E2A39" stroke-width="1.5"/>
      <path d="M17 49 C 29 20, 43 20, 55 49" stroke="#6E2A39" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <div style="font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 148px; line-height: 0.9; letter-spacing: -0.01em; color: #201B14;">Aria</div>

    </div>
  </div>

  <!-- bottom rule -->
  <div style="height: 1px; background: #E7E0D3;"></div>
  <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 18px; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #8A8070;">
    <span>Ivory · Ink · Bordeaux</span>
    <span>Newsreader × Hanken</span>
